kind = "web"
previewPath = "/trader-cockpit/"
title = "SwiftX Trader Cockpit"
description = "A focused desktop P2P trading workspace for SwiftX users to scan offers, manage deals, advertisements, and payment details."
version = "1.0.0"
id = "artifacts/swiftx-trader-cockpit"
router = "path"

[[services]]
name = "web"
paths = [ "/trader-cockpit/" ]
localPort = 25229

[services.development]
run = "pnpm --filter @workspace/swiftx-trader-cockpit run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/swiftx-trader-cockpit", "run", "build" ]
serve = "static"
publicDir = "artifacts/swiftx-trader-cockpit/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25229"
BASE_PATH = "/trader-cockpit/"
